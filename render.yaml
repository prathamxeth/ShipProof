services:
  # ShipProof Unified Backend & Store
  - type: web
    name: shipproof-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: WORKER_EXECUTION_MODE
        value: subprocess
      - key: ALLOW_LOCAL_TARGETS
        value: "true"
      - key: SHIPPROOF_BETA_KEY
        value: e2eb14edb1e819e5ac2250c4979c94181cd51419f29edf3a4f7279822d8c9f6a
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://shipproof.vercel.app
    disk:
      name: shipproof-data
      mountPath: /app/backend/data
      sizeGB: 1
