services:
  # ShipProof Unified All-in-One Service (Frontend + Backend + Store + Kane CLI)
  - type: web
    name: shipproof
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DEPLOYMENT_MODE
        value: trusted_single_tenant
      - key: WORKER_EXECUTION_MODE
        value: subprocess
      - key: ALLOW_LOCAL_TARGETS
        value: "true"
      - key: SHIPPROOF_BETA_KEY
        value: e2eb14edb1e819e5ac2250c4979c94181cd51419f29edf3a4f7279822d8c9f6a
      - key: SHIPPROOF_API_KEY
        value: e2eb14edb1e819e5ac2250c4979c94181cd51419f29edf3a4f7279822d8c9f6a
      - key: SESSION_SECRET
        value: e2eb14edb1e819e5ac2250c4979c94181cd51419f29edf3a4f7279822d8c9f6a
      - key: NEXT_PUBLIC_BACKEND_URL
        value: http://127.0.0.1:8000
      - key: NEXT_PUBLIC_STORE_URL
        value: http://127.0.0.1:3005
