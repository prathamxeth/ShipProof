<!-- Hallmark · macrostructure: E-Commerce Store · theme: Springlight · typography: Instrument Serif + Inter -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Acme Voyager Store — Springlight Edition" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-image: url('/static/images/shipproof-spring-bg.jpeg');
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --foreground: #1c2a22;
      --foreground-muted: #4e6357;
      --card-bg: rgba(255, 255, 255, 0.84);
      --card-border: rgba(255, 255, 255, 0.9);
      --border-subtle: rgba(45, 74, 62, 0.12);
      --primary: #2d4a3e;
      --primary-hover: #1f352c;
      --accent-rose: #d9748b;
      --success: #1b7a4b;
      --danger: #d9383a;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      overflow-x: clip;
      font-family: var(--font-body);
      color: var(--foreground);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background-color: #f7f5ef;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Pure, crisp spring meadow background — no tint veil */
    .ambient-spring-veil {
      display: none;
    }

    :focus-visible {
      outline: 1.5px solid rgba(45, 74, 62, 0.6);
      outline-offset: 2px;
      transition: none !important;
    }

    /* Top Navigation — Springlight Editorial Header */
    header {
      position: relative;
      z-index: 20;
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 1rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(35, 55, 45, 0.05);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2d4a3e, #426b5a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(45, 74, 62, 0.25);
    }

    .brand-text-block {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-family: var(--font-body);
      font-size: 0.72rem;
      color: var(--foreground-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-weight: 500;
      margin-top: 2px;
    }

    .nav-links {
      display: flex;
      gap: 0.85rem;
      align-items: center;
    }

    /* Springlight Badges */
    .badge {
      font-family: var(--font-body);
      font-size: 0.72rem;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border: 1px solid rgba(45, 74, 62, 0.18);
      background: rgba(255, 255, 255, 0.85);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 1px 3px rgba(35, 55, 45, 0.05);
    }

    .badge-live {
      background: rgba(27, 122, 75, 0.1);
      color: var(--success);
      border-color: rgba(27, 122, 75, 0.25);
    }

    .badge-live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px rgba(27, 122, 75, 0.6);
      animation: pulseDot 2s infinite;
    }

    .badge-defect {
      background: rgba(217, 56, 58, 0.12);
      color: var(--danger);
      border-color: rgba(217, 56, 58, 0.3);
      animation: pulseAlert 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes pulseAlert {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 10;
      max-width: 1120px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    /* Springlight Alabaster Cards */
    .card {
      position: relative;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 32px -8px rgba(35, 55, 45, 0.08), 0 2px 6px rgba(35, 55, 45, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 2rem;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-content {
      position: relative;
      z-index: 2;
    }

    .card:hover {
      box-shadow: 0 16px 40px -10px rgba(35, 55, 45, 0.12), 0 2px 8px rgba(35, 55, 45, 0.04);
    }

    /* Hero Banner */
    .store-hero-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 252, 247, 0.82) 100%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 48px -12px rgba(35, 55, 45, 0.1);
      padding: 2.5rem;
    }

    .store-hero-content {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .store-hero-badge-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .store-hero-title {
      font-family: var(--font-display);
      font-size: 2.85rem;
      font-weight: 400;
      color: var(--primary);
      letter-spacing: -0.015em;
      line-height: 1.08;
      margin: 0.6rem 0;
    }

    .store-hero-desc {
      font-size: 1.05rem;
      color: var(--foreground-muted);
      max-width: 680px;
      line-height: 1.6;
    }

    /* Catalog Section Header */
    .catalog-section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .catalog-section-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 400;
      color: var(--primary);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .catalog-section-subtitle {
      font-size: 0.85rem;
      color: var(--foreground-muted);
      font-weight: 500;
    }

    /* Grid layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
    }

    /* Product Card */
    .product-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.75rem;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius);
    }

    .product-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(45, 74, 62, 0.05);
      border: 1px solid rgba(45, 74, 62, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 1.25rem;
    }

    .product-title-link {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--foreground);
      text-decoration: none;
      transition: color 0.15s ease;
      line-height: 1.2;
    }

    .product-title-link:hover {
      color: var(--primary);
    }

    .product-desc {
      font-size: 0.9rem;
      color: var(--foreground-muted);
      line-height: 1.55;
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .product-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-subtle);
    }

    .product-price-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--foreground-muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      display: block;
    }

    .product-price-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    /* Buttons */
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: var(--font-body);
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 2px 8px rgba(45, 74, 62, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(45, 74, 62, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: var(--foreground);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background: #ffffff;
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-disabled {
      background: rgba(200, 205, 202, 0.6) !important;
      color: rgba(90, 100, 95, 0.7) !important;
      cursor: not-allowed !important;
      border: 1px solid rgba(180, 185, 182, 0.5) !important;
      box-shadow: none !important;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      background: rgba(45, 74, 62, 0.06);
      border: 1px solid rgba(45, 74, 62, 0.15);
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: rgba(45, 74, 62, 0.12);
      color: var(--primary-hover);
    }

    /* Cart Summary Banner */
    .cart-summary-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      background: rgba(45, 74, 62, 0.04);
      border: 1px solid rgba(45, 74, 62, 0.12);
      border-radius: 16px;
      margin-top: 1rem;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--foreground-muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"], input[type="email"], input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(45, 74, 62, 0.2);
      background: rgba(255, 255, 255, 0.95);
      color: var(--foreground);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 74, 62, 0.12);
    }

    .order-summary-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem;
      background: rgba(45, 74, 62, 0.05);
      border: 1px solid rgba(45, 74, 62, 0.12);
      border-radius: 14px;
      margin-bottom: 1.75rem;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      border-top: 1px solid var(--border-subtle);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--foreground-muted);
      margin-top: auto;
    }

    @media (max-width: 768px) {
      header { padding: 0.75rem 1.25rem; }
      .container { padding: 0 1rem; margin: 1.5rem auto; }
      .store-hero-card { padding: 1.5rem; }
      .store-hero-title { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <!-- Ambient Atmospheric Veil -->
  <div class="ambient-spring-veil" aria-hidden="true"></div>

  <!-- Top Navigation Header -->
  <header>
    <a href="/" class="brand-wrap">
      <div class="brand-icon">🌿</div>
      <div class="brand-text-block">
        <span class="brand-title">Acme Voyager</span>
        <span class="brand-subtitle">Springlight Performance Gear</span>
      </div>
    </a>

    <div class="nav-links">
      <a href="/" class="nav-btn">
        <span>Catalog</span>
      </a>
      <a href="/cart" class="nav-btn" id="nav-cart-btn">
        <span>Shopping Bag</span>
        <span class="badge" style="background: var(--primary); color: #fff; border: none; padding: 0.15rem 0.45rem;">{{ cart_count }}</span>
      </a>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Editorial Footer -->
  <footer>
    <div>
      <strong style="color: var(--primary);">Acme Voyager Store</strong> &bull; Performance Trail &amp; Travel Collection
    </div>
    <div>
      <span>Continuous Checkout Protection</span>
    </div>
  </footer>
</body>
</html>
