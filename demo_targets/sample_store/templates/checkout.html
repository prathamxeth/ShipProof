{% extends "layout.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;" id="checkout-form-container">
  <h1 id="checkout-header" style="font-size: 1.75rem; margin-bottom: 1.5rem;">Secure Checkout</h1>

  <form action="/checkout" method="POST" id="checkout-form">
    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);" for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" required value="Alex Johnson" style="width: 100%; padding: 0.75rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;">
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);" for="email">Email Address</label>
      <input type="email" id="email" name="email" required value="alex@example.com" style="width: 100%; padding: 0.75rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);" for="address">Shipping Address</label>
      <input type="text" id="address" name="address" required value="123 AI Boulevard, Suite 400, San Francisco, CA" style="width: 100%; padding: 0.75rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;">
    </div>

    <div style="background: var(--bg); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 1rem; color: var(--text-muted);">Total Order Amount:</span>
      <span style="font-size: 1.5rem; font-weight: 800; color: #60a5fa;" id="checkout-total">${{ "%.2f"|format(subtotal) }}</span>
    </div>

    <button type="submit" class="btn btn-primary" id="place-order-btn" style="width: 100%; padding: 0.85rem; font-size: 1.1rem;">Place Order Now</button>
  </form>
</div>
{% endblock %}
