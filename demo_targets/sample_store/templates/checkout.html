{% extends "layout.html" %}

{% block content %}
<div class="card" style="max-width: 640px; margin: 1.5rem auto; padding: 2.5rem;" id="checkout-form-container">
  <div class="card-content">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 1.25rem;">
      <div>
        <h1 id="checkout-header" style="font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">
          Secure Checkout
        </h1>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem;">
          Express Checkout &bull; 256-Bit SSL Encrypted &bull; Instant Order Placement
        </p>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #34d399;">
        ✓
      </div>
    </div>

    <form action="/checkout" method="POST" id="checkout-form">
      <div class="form-group">
        <label class="form-label" for="full_name">
          Customer Full Name
        </label>
        <input type="text" id="full_name" name="full_name" required value="Alex Johnson" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">
          Email Address
        </label>
        <input type="email" id="email" name="email" required value="alex@example.com" placeholder="Enter your email address">
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="form-label" for="address">
          Shipping Address
        </label>
        <input type="text" id="address" name="address" required value="123 AI Boulevard, Suite 400, San Francisco, CA" placeholder="Enter shipping address">
      </div>

      <!-- Order Total Summary Box -->
      <div class="order-summary-box">
        <div>
          <span style="font-size: 0.82rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; display: block;">Total Due Now</span>
          <span style="font-size: 0.75rem; color: #64748b;">Includes standard taxes &amp; shipping</span>
        </div>
        <span style="font-size: 1.85rem; font-weight: 800; color: #34d399; letter-spacing: -0.02em;" id="checkout-total">
          ${{ "%.2f"|format(subtotal) }}
        </span>
      </div>

      <button type="submit" class="btn btn-primary" id="place-order-btn" style="width: 100%; padding: 0.95rem; font-size: 1.05rem;">
        <span>Place Order Now</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
